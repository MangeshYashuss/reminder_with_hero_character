name: Build desktop apps
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest -v
      - run: python build_desktop.py
      - name: Test Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $app = Get-ChildItem dist -Filter SipSidekick.exe -Recurse | Select-Object -First 1
          $report = Join-Path $env:RUNNER_TEMP 'sipsidekick-smoke.json'
          $process = Start-Process -FilePath $app.FullName -ArgumentList "--smoke-test `"$report`"" -PassThru -WindowStyle Hidden
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'Smoke test timed out' }
          if ($process.ExitCode -ne 0) { throw 'Smoke test failed' }
          if (-not (Get-Content $report -Raw | ConvertFrom-Json).ok) { throw 'Smoke report failed' }
      - name: Test macOS app bundle
        if: runner.os == 'macOS'
        run: |
          app=$(find dist -path '*/SipSidekick.app/Contents/MacOS/SipSidekick' -type f | head -n 1)
          "$app" --smoke-test "$RUNNER_TEMP/sipsidekick-smoke.json"
          python -c 'import json, os; assert json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "sipsidekick-smoke.json")))["ok"]'
      - uses: actions/upload-artifact@v4
        with:
          name: SipSidekick-${{ matrix.os }}
          path: |
            dist/**/*.zip
            dist/**/READ-ME.txt
            dist/**/ARTWORK-CREDITS.txt
          if-no-files-found: error
